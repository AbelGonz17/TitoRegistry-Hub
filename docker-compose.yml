services:
  postgres:
    image: postgres:16-alpine
    container_name: titoregistry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: titoregistry_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d titoregistry_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: titoregistry-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=titoregistry_db;Username=postgres;Password=postgres"
      ASPNETCORE_URLS: "http://+:5107"
    ports:
      - "5107:5107"

volumes:
  postgres_data:
